linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gofmt
    - goimports
    - gosec
linters-settings:
  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"
issues:
  max-same-issues: 5
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: cmd/sequoia/main\.go
      linters:
        - errcheck
    - path: cmd/sequoia/main\.go
      linters:
        - gosec
      text: "G104:"
    - path: adapters/
      linters:
        - gosec
      text: "G304:"
