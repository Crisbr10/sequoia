version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gosec
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "sayRepetitiveInsteadOfStutters"
  exclusions:
    rules:
      # Test files: allow relaxed permissions and file operations
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      # main.go: intentional unchecked errors + gosec noise
      - path: cmd/sequoia/main\.go
        linters:
          - errcheck
          - gosec
      # adapter/ files: intentional file operations
      - path: adapters/
        linters:
          - gosec
      # Mock adapter: no comments needed for generated mocks
      - path: adapters/testutil/mock_adapter\.go
        linters:
          - revive
      # Plugin loader: os.ReadDir with variable is by design
      - path: plugin/loader\.go
        linters:
          - gosec
      # Plugin implementation: no comments needed for interface methods
      - path: plugin/loader\.go
        linters:
          - revive
      # Embedded FS vars: don't need comments
      - path: adapters/common/embed\.go
        linters:
          - revive
      - path: adapters/common/installembed/embed\.go
        linters:
          - revive
      # Known unused vars in specific files
      - path: internal/tui/screens/uninstall\.go
        linters:
          - unused
      - path: adapters/opencode/paths\.go
        linters:
          - unused
      - path: adapters/claude/paths\.go
        linters:
          - unused
      # Pipeline runner: intentional unchecked errors
      - path: internal/pipeline/runner\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-same-issues: 5
