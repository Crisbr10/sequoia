schema: spec-driven

# sequoia-ai — OpenSpec configuration
# Project: github.com/Crisbr10/sequoia
# Generated by: sdd-init (mode: openspec)
# Last updated: 2026-06-16

context: |
  Project: sequoia-ai (module github.com/Crisbr10/sequoia)
  Language: Go 1.25.8
  CLI: spf13/cobra 1.10.2
  TUI: charmbracelet/bubbletea 1.3.10 + charmbracelet/lipgloss 1.1.0
  Config: BurntSushi/toml 1.6.0, gopkg.in/yaml.v3 3.0.1
  Test: stretchr/testify 1.11.1
  Lint: golangci-lint v2.12 (errcheck, govet, ineffassign, staticcheck, unused, misspell, revive, gosec)
  Format: gofmt + goimports
  Security: govulncheck v1.3.0
  CI matrix: ubuntu-latest, macos-latest, macos-14, ubuntu-24.04-arm, windows-latest
  Architecture: Hexagonal — adapters/ (claude, codex, cursor, gemini, opencode, common, testutil), internal/ (app, codegraph, model, pipeline, tui), cmd/sequoia
  Plugins: plugin/ loader (Go plugin package)
  Coverage gate: 70%
  Race detector: enabled on non-windows; disabled on windows-latest

# ---------------------------------------------------------------------------
# Project-specific rules applied across the SDD phases.
# ---------------------------------------------------------------------------
rules:
  proposal:
    - Include rollback plan for risky changes
    - State blast radius (which packages / commands / installers are affected)
    - Identify whether a chain-PR split is required (force-chained strategy, <=400 lines)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Use ADDED / MODIFIED / REMOVED / RENAMED delta sections
    - One domain per delta spec under changes/{name}/specs/{domain}/
  design:
    - Document architecture decisions with rationale (trade-offs considered)
    - Reference affected packages explicitly (adapters/, internal/, cmd/, plugin/)
    - Note interaction with plugin/ loader when touching adapter interfaces
  tasks:
    - Group by phase, use hierarchical numbering (1, 1.1, 1.2, …)
    - Keep tasks completable in one session (target <=400 lines per PR)
    - When the change is large, pre-plan chained PRs (see chained-pr skill)
  apply:
    tdd: true
    test_command: "go test ./... -coverprofile=coverage.out -covermode=atomic -race -count=1 -timeout 120s"
    # On windows-latest the CI drops -race -covermode=atomic; keep the canonical
    # command here and let CI matrix override locally.
  verify:
    test_command: "go test ./... -coverprofile=coverage.out -covermode=atomic -race -count=1 -timeout 120s"
    build_command: "go build ./cmd/sequoia/"
    coverage_threshold: 70
    race_detector: "enabled on non-windows; disabled on windows-latest"
    lint_command: "golangci-lint run"
    vulncheck_command: "go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./..."
    go_vet_command: "go vet ./..."
  archive:
    - Warn before merging destructive deltas
    - Preserve main-spec fidelity (delta merge into openspec/specs/{domain}/spec.md)
    - Move change folder to openspec/changes/archive/YYYY-MM-DD-{change-name}/
    - Never delete or modify archived changes (audit trail)

# ---------------------------------------------------------------------------
# Testing capabilities (consumed by sdd-apply / sdd-verify).
# ---------------------------------------------------------------------------
testing:
  strict_tdd: true
  detected: 2026-06-16
  test_runner:
    command: "go test ./... -coverprofile=coverage.out -covermode=atomic -race -count=1 -timeout 120s"
    framework: "stretchr/testify"
  layers:
    unit:
      available: true
      tool: "stretchr/testify (table-driven)"
    integration:
      available: true
      tool: "internal/app/integration_test.go + Bubbletea teatest"
    e2e:
      available: false
      tool: "—"
  coverage:
    available: true
    command: "go test ./... -coverprofile=coverage.out"
    threshold: 70
  quality:
    linter:
      available: true
      command: "golangci-lint run"
    type_checker:
      available: true
      command: "go vet ./..."
    formatter:
      available: true
      command: "gofmt -l . && goimports -l ."
  golden_files:
    available: true
    paths:
      - internal/tui/screens/testdata/golden/
      - adapters/codex/templates/testdata/golden/
      - adapters/cursor/templates/testdata/golden/
      - adapters/gemini/templates/testdata/golden/
  mocks:
    available: true
    package: "adapters/testutil"
