name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.1.0). Required for manual dispatch.'
        required: false
        type: string
        default: ''
      skip_publish:
        description: 'Skip GoReleaser publish (build, verify, and sign only — no GitHub Release)'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write   # needed for cosign keyless signing
  contents: write   # needed to upload release assets

jobs:
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "1.25"
          cache: true
      - name: Vulncheck
        # govulncheck exits non-zero on CVE discovery — this WILL block the release
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  test:
    name: Pre-release tests (${{ matrix.os }})
    needs: [vulncheck]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "1.25"
          cache: true
      - name: Test
        run: go test -race -count=1 ./...

  goreleaser:
    name: GoReleaser
    needs: test
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Determine Release Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=$(git describe --tags --abbrev=0 2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "1.25"
          cache: true

      - name: Build (GoReleaser snapshot)
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89  # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SHA-256 Checksums
        run: |
          echo "Verifying SHA-256 checksums before cosign signing..."
          FAIL=0
          cd dist
          for checksum_file in sequoia_*_checksums.txt; do
            if [ -f "$checksum_file" ]; then
              echo "  Checking $checksum_file..."
              sha256sum -c "$checksum_file" --strict 2>/dev/null || FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then
            echo ""
            echo "ERROR: SHA-256 checksum mismatch! Aborting release."
            exit 1
          fi
          echo "All SHA-256 checksums verified successfully."

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Sign with Cosign
        run: |
          echo "Signing release binaries with cosign..."
          find dist -type f \( -name "sequoia" -o -name "sequoia.exe" \) | while read -r binary; do
            echo "  Signing $binary..."
            cosign sign-blob --yes \
              --oidc-issuer https://token.actions.githubusercontent.com \
              --output-signature="${binary}.sig" \
              --output-certificate="${binary}.pem" \
              "$binary"
          done
          echo "Cosign signing complete."

      - name: Publish (GoReleaser)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_publish }}
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89  # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  smoke:
    name: Post-Deploy Smoke
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.version }}" ]; then
              TAG="${{ inputs.version }}"
            else
              TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION=$(echo "$TAG" | sed 's/^v//')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download checksums.txt
        run: |
          curl -fsSL -o checksums.txt \
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/sequoia_${{ steps.tag.outputs.version }}_checksums.txt"

      - name: Download Linux AMD64 Binary
        run: |
          curl -fsSL -o sequoia_linux_amd64.tar.gz \
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/sequoia_${{ steps.tag.outputs.version }}_linux_amd64.tar.gz"

      - name: Verify SHA-256 of Published Binary
        run: |
          echo "Verifying published binary checksum..."
          EXPECTED=$(grep "sequoia_${{ steps.tag.outputs.version }}_linux_amd64.tar.gz" checksums.txt | awk '{print $1}')
          ACTUAL=$(sha256sum sequoia_linux_amd64.tar.gz | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: Published binary checksum mismatch!"
            echo "  Expected: $EXPECTED"
            echo "  Actual:   $ACTUAL"
            exit 1
          fi
          echo "Published binary checksum verified: $ACTUAL"

      - name: Extract and Smoke Test
        run: |
          tar xzf sequoia_linux_amd64.tar.gz
          chmod +x sequoia
          echo "Running 'sequoia version'..."
          ./sequoia version
          echo "Running 'sequoia status'..."
          ./sequoia status
          echo "Post-deploy smoke test passed!"
