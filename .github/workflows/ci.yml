name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Verify
        run: go mod verify
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.12

  test:
    name: Test (${{ matrix.os }})
    needs: [vulncheck]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14, ubuntu-24.04-arm, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            go test ./... -coverprofile=coverage.out -count=1 -timeout 120s
          else
            go test ./... -coverprofile=coverage.out -covermode=atomic -race -count=1 -timeout 120s
          fi
        shell: bash
      - name: Coverage Check
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov < 70) exit 1; exit 0 }' || { echo "ERROR: Coverage ${COVERAGE}% is below 70% threshold"; exit 1; }
          echo "Coverage ${COVERAGE}% meets 70% threshold"
        shell: bash

  build:
    name: Build (${{ matrix.os }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14, ubuntu-24.04-arm, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -o sequoia${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/sequoia/
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sequoia-${{ matrix.os }}
          path: sequoia${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  smoke:
    name: Smoke
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sequoia-ubuntu-latest
      - name: Make Executable
        run: chmod +x sequoia
      - name: Install Smoke
        run: ./sequoia install --no-tui
      - name: Status Smoke
        run: ./sequoia status
      - name: Uninstall Smoke
        run: ./sequoia uninstall --all --yes

  action-pinning:
    name: Action Pinning Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Scan for unpinned actions
        run: |
          echo "Scanning .github/workflows/*.yml for floating action refs..."
          if grep -nP 'uses:\s+\S+@(?![\da-f]{40})' .github/workflows/*.yml; then
            echo ""
            echo "ERROR: Unpinned action references found above."
            echo "All 'uses:' directives must reference full commit SHAs."
            echo "Floating refs (@vX, @main, @master) are prohibited."
            exit 1
          fi
          echo "All actions pinned to commit SHAs."
