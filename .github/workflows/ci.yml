name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20  # v9
        with:
          version: v2.12

  test:
    name: Test (${{ matrix.os }})
    needs: [vulncheck]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14, ubuntu-24.04-arm, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            go test ./... -coverprofile=coverage.out -count=1 -timeout 120s
          else
            go test ./... -coverprofile=coverage.out -covermode=atomic -race -count=1 -timeout 120s
          fi
        shell: bash
      - name: Coverage Check
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov < 70) exit 1; exit 0 }' || { echo "ERROR: Coverage ${COVERAGE}% is below 70% threshold"; exit 1; }
          echo "Coverage ${COVERAGE}% meets 70% threshold"
        shell: bash

  build:
    name: Build (${{ matrix.os }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14, ubuntu-24.04-arm, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -o sequoia${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/sequoia/
      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sequoia-${{ matrix.os }}
          path: sequoia${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  smoke:
    name: Smoke
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: sequoia-ubuntu-latest
      - name: Make Executable
        run: chmod +x sequoia
      - name: Install Smoke
        run: ./sequoia install --no-tui
        continue-on-error: true
      - name: Status Smoke
        run: ./sequoia status
      - name: Uninstall Smoke
        run: ./sequoia uninstall --all --yes
        continue-on-error: true

  action-pinning:
    name: Action Pinning Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Scan for unpinned actions
        run: |
          echo "Scanning .github/workflows/*.yml for floating action refs..."
          if grep -nP 'uses:\s+\S+@(?![\da-f]{40})' .github/workflows/*.yml; then
            echo ""
            echo "ERROR: Unpinned action references found above."
            echo "All 'uses:' directives must reference full commit SHAs."
            echo "Floating refs (@vX, @main, @master) are prohibited."
            exit 1
          fi
          echo "All actions pinned to commit SHAs."
