name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12

  test:
    name: Test (${{ matrix.os }})
    needs: [vulncheck]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14, ubuntu-24.04-arm, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            go test ./... -coverprofile=coverage.out -count=1 -timeout 120s
          else
            go test ./... -coverprofile=coverage.out -covermode=atomic -race -count=1 -timeout 120s
          fi
        shell: bash
      - name: Coverage Check
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov < 70) exit 1; exit 0 }' || { echo "ERROR: Coverage ${COVERAGE}% is below 70% threshold"; exit 1; }
          echo "Coverage ${COVERAGE}% meets 70% threshold"
        shell: bash

  build:
    name: Build (${{ matrix.os }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14, ubuntu-24.04-arm, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -o sequoia${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/sequoia/
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sequoia-${{ matrix.os }}
          path: sequoia${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  smoke:
    name: Smoke
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: sequoia-ubuntu-latest
      - name: Make Executable
        run: chmod +x sequoia
      - name: Install Smoke
        run: ./sequoia install --no-tui
        continue-on-error: true
      - name: Status Smoke
        run: ./sequoia status
      - name: Uninstall Smoke
        run: ./sequoia uninstall --all --yes
        continue-on-error: true
